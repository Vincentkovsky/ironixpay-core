<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="IronixPay — Secure cryptocurrency checkout. Complete your payment quickly with USDT on Tron network." />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Prevent dark-mode flash: apply theme class before first paint -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var t = p.get('theme');
      if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme:dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Preload self-hosted Inter font for fastest LCP -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

  <title>IronixPay Checkout</title>

  <!-- Inline critical loading styles — renders before any JS/CSS bundles -->
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('/fonts/inter-latin.woff2') format('woff2');
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .loading-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #F7F7F8;
    }

    html.dark .loading-shell {
      background: #0f172a;
    }

    .loading-card {
      width: 420px;
      max-width: 90vw;
      padding: 48px 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
      text-align: center;
    }

    html.dark .loading-card {
      background: #1e293b;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      border: 3px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    html.dark .loading-spinner {
      border-color: #334155;
      border-top-color: #3b82f6;
    }

    .loading-text {
      font-size: 14px;
      color: #6b7280;
      font-weight: 500;
    }

    html.dark .loading-text {
      color: #94a3b8;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Hide shell once Vue mounts */
    #app:not(:empty)+.loading-shell {
      display: none;
    }

    .loading-shell:has(~ #app:not(:empty)) {
      display: none;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <!-- Static loading skeleton — serves as LCP element, disappears when Vue mounts -->
  <div class="loading-shell" aria-hidden="true">
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading payment...</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
