[package]
name = "ironix_pay"
version = "0.1.0"
edition = "2021"
default-run = "ironix_pay"

[[bin]]
name = "seed_blacklist"
path = "src/bin/seed_blacklist.rs"

[[bin]]
name = "encrypt_secrets"
path = "src/bin/encrypt_secrets.rs"

[[bin]]
name = "ironix_pay"
path = "src/main.rs"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["macros", "ws"] }
axum-extra = { version = "0.9", features = ["typed-header", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tower_governor = { version = "0.5.0", features = ["axum"] }

# API Documentation
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"

# Async Runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Database ORM
sea-orm = { version = "1.0", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = "1.0"
migration = { path = "migration" }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls"] }




# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1"

# Crypto
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.23"
hmac = "0.12"
hex = "0.4"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }  # RFC 6238 TOTP
bip32 = { version = "0.5", features = ["bip39", "secp256k1"] }
bip39 = "2.0"
bitcoin = "0.32"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
bs58 = { version = "0.5", features = ["check"] }
zeroize = { version = "1", features = ["derive"] }
secrecy = { version = "0.8", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
slip10_ed25519 = "0.1"

# Solana SDK — transaction building, instruction construction, ComputeBudget
# default-features = false excludes keypair/signer/seed-phrase (we use our own TransactionSigner)
solana-sdk = { version = "2", default-features = false }
spl-token = { version = "9", default-features = false, features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8", default-features = false, features = ["no-entrypoint"] }
bincode = "1"

# EVM / ABI
alloy-sol-types = "0.8"
alloy-primitives = "0.8"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# UUID
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Random
rand = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Tracking
sentry = { version = "0.46.2", features = ["tracing", "tower", "tower-http"] }

# Metrics (Prometheus)
axum-prometheus = "0.7"

# Error handling
thiserror = "1"
anyhow = "1"
async-trait = "0.1"

# Environment
dotenvy = "0.15"

# HTTP Client (for webhooks and Tron API)
reqwest = { version = "0.12", features = ["json"] }
reqwest-middleware = { version = "0.4", features = ["json"] }
reqwest-retry = "0.7"
tokio-util = { version = "0.7.18", features = ["rt", "io", "io-util", "codec"] }
regex = "1.12.2"
rust_decimal = { version = "1.40.0", features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"] }
ts-rs = { version = "11.1.0", features = ["uuid-impl", "chrono-impl", "serde-compat", "format", "no-serde-warnings"] }
dashmap = "6"
tracing-appender = "0.2.4"
url = "2.5.8"
lazy_static = "1.5.0"
scopeguard = "1"
async-stream = "0.3.6"
nix = { version = "0.29", features = ["fs"] }

# AWS KMS (envelope encryption) + S3 (R2 logo storage)
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-kms = "1"
aws-sdk-s3 = "1"
clap = { version = "4", features = ["derive"] }


[dev-dependencies]
tokio-test = "0.4"
axum-test = "15"
tower = { version = "0.4", features = ["util"] }
mockall = "0.12"
tempfile = "3"
wiremock = "0.6"
rand_core = "0.9.3"
proptest = "1"
rust_decimal_macros = "1"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
